spring.application.name=seat_selection
spring.threads.virtual.enabled=true
server.port=${PORT:8080}
spring.jackson.property-naming-strategy=SNAKE_CASE

# A full JDBC URL wins; otherwise it is built from parts (Render exposes host/port/name separately).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seats}}
spring.datasource.username=${DATABASE_USERNAME:seats}
spring.datasource.password=${DATABASE_PASSWORD:seats}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
# Under a burst, requests queue for a connection instead of failing: a buyer who waits gets
# the real answer (201 or 409). Only if no connection frees up in this time does the request
# end, as a 503 "overloaded" (see ApiExceptionHandler).
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:300000}
# Queue a stampede of new connections instead of resetting them (the OS caps this: somaxconn).
server.tomcat.accept-count=1000
spring.jooq.sql-dialect=postgres

app.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.admin-api-key=${ADMIN_API_KEY:dev-admin-key}
app.hold-ttl=${HOLD_TTL:120s}
app.default-per-user-limit=4

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
# Readiness = app accepting traffic + database reachable (own connection, short timeouts; see DatabaseHealthIndicator).
management.endpoint.health.group.readiness.include=readinessState,database
# The built-in pool-based db check would block for the pool's 60s timeout when Postgres is down.
management.health.db.enabled=false
management.endpoint.health.show-details=always

logging.structured.format.console=ecs
